version: "3.9"

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Point to the MCP server inside the container
      MCP_SERVER_PATH: /mcp_server/server.py
      MCP_PYTHON_BIN: python3
      MONGODB_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
    volumes:
      # Mount your existing MCP repo at /mcp_server
      - ${MCP_SERVER_REPO_PATH:-./mcp_server}:/mcp_server:ro
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant (Phase 2 — RAG) ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
